name: Build
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      pages: write
      actions: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
          
      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: /bin/ls
